name: Show your version
description: Share a version of Content Manager you changed for your own work.
title: "[Remix] "
body:
  - type: markdown
    attributes:
      value: |
        Show what you made. One screenshot and a few honest sentences are enough. Please
        make sure nothing in it shows someone else's private details.
  - type: input
    id: repository
    attributes:
      label: Your repository
      placeholder: https://github.com/you/your-repo
    validations:
      required: true
  - type: input
    id: import_url
    attributes:
      label: Install link
      description: The Lemma import URL for your repository.
      placeholder: https://lemma.work/import/github/you/your-repo
    validations:
      required: true
  - type: textarea
    id: changed
    attributes:
      label: What did you change?
      description: Who uses it, and what is different from the original.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Show it working
      description: One screenshot, a short recording, or a post it drafted.
    validations:
      required: true
